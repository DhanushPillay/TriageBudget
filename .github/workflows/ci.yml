name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run python -m triage.cli fixture-eval --work-dir reports/fixture_run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-eval
          path: reports/fixture_run/
          retention-days: 7
